services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: minikinopoisk
      POSTGRES_USER: minikinopoisk_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/minikinopoisk
      SPRING_DATASOURCE_USERNAME: minikinopoisk_user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - db

volumes:
  postgres-data:
2. Исправленный application-docker.properties:
  properties
  # Базовое имя приложения
  spring.application.name=mini-kinopoisk
  
  # Порт сервера
  server.port=8080
  
  # Настройки подключения к БД для Docker окружения
  spring.datasource.url=jdbc:postgresql://localhost:5432/minikinopoisk
  spring.datasource.username=minikinopoisk_user
  spring.datasource.password=password
  
  # Настройки JPA
  spring.jpa.hibernate.ddl-auto=create
  spring.jpa.show-sql=true
  spring.jpa.properties.hibernate.format_sql=true
  
  # Отключение open-in-view
  spring.jpa.open-in-view=false
  
  # Настройки для тестирования
  spring.test.database.replace=none
  
  # Активация профиля Docker
  spring.profiles.active=docker
  
  # Логирование SQL запросов
  logging.level.org.hibernate.SQL=DEBUG
  logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE